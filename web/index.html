<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Symphony – Minimalist offline music player.">
  <meta name="theme-color" content="#0A0A0A">

  <!-- OpenGraph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Symphony — Minimalist Offline Music">
  <meta property="og:description" content="Clean, distraction-free offline music player and playlist hub.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Symphony — Minimalist Offline Music">
  <meta name="twitter:description" content="Clean, distraction-free offline music player and playlist hub.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Service Worker Management -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Symphony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/symphony_logo.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">

  <title>Symphony</title>
  <link rel="manifest" href="manifest.json">

  <!-- Minimalist Clean Monochrome Entrance -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #symphony-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }
    .symphony-logo-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222226;
      background-color: #0A0A0A;
    }
    .symphony-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .symphony-title {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #E4E4E7;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Clean Minimalist Splash -->
  <div id="symphony-loader">
    <div class="symphony-logo-wrapper">
      <img src="icons/Icon-192.png" alt="Symphony" class="symphony-logo-img">
    </div>
    <div class="symphony-title">Symphony</div>
  </div>

  <script src="flutter_bootstrap.js?v=4" async></script>
</body>
</html>
