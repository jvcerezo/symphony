<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Symphony – Minimalist offline music player.">
  <meta name="theme-color" content="#0A0A0A">

  <!-- OpenGraph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Symphony — Minimalist Offline Music">
  <meta property="og:description" content="Clean, distraction-free offline music player and playlist hub.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Symphony — Minimalist Offline Music">
  <meta name="twitter:description" content="Clean, distraction-free offline music player and playlist hub.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Service Worker Management -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Symphony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/symphony_logo.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">

  <title>Symphony</title>
  <link rel="manifest" href="manifest.json">

  <!-- Minimalist Clean Monochrome Entrance with Dynamic Loading Wave -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #symphony-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99999;
      user-select: none;
    }
    .symphony-logo-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #26262A;
      background-color: #0A0A0A;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .symphony-logo-svg {
      width: 54px;
      height: 54px;
      display: block;
    }
    .symphony-bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: symphonyWaveBar 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .bar-1 { animation-delay: -1.0s; }
    .bar-2 { animation-delay: -0.75s; }
    .bar-3 { animation-delay: -0.5s; }
    .bar-4 { animation-delay: -0.25s; }
    .bar-5 { animation-delay: 0.0s; }

    @keyframes symphonyWaveBar {
      0%, 100% {
        transform: scaleY(0.26);
        opacity: 0.4;
      }
      50% {
        transform: scaleY(1.04);
        opacity: 1.0;
      }
    }

    .symphony-title {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3.5px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    /* Ambient Equalizer Loading Wave */
    .symphony-wave-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 14px;
      height: 14px;
    }
    .wave-track {
      width: 2.5px;
      height: 12px;
      background-color: #52525B;
      border-radius: 2px;
      transform-origin: center;
      animation: symphonyMiniWave 1.1s ease-in-out infinite;
    }
    .t1 { animation-delay: -0.88s; }
    .t2 { animation-delay: -0.66s; }
    .t3 { animation-delay: -0.44s; }
    .t4 { animation-delay: -0.22s; }
    .t5 { animation-delay: 0.0s; }

    @keyframes symphonyMiniWave {
      0%, 100% {
        transform: scaleY(0.25);
        background-color: #3F3F46;
        opacity: 0.45;
      }
      50% {
        transform: scaleY(1.0);
        background-color: #FFFFFF;
        opacity: 1.0;
      }
    }
  </style>
</head>
<body>
  <!-- Architectural Soundwave Entrance -->
  <div id="symphony-loader">
    <div class="symphony-logo-wrapper">
      <svg class="symphony-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <g fill="#FFFFFF">
          <rect class="symphony-bar bar-1" x="119" y="208" width="34" height="96" rx="17"/>
          <rect class="symphony-bar bar-2" x="179" y="166" width="34" height="180" rx="17"/>
          <rect class="symphony-bar bar-3" x="239" y="118" width="34" height="276" rx="17"/>
          <rect class="symphony-bar bar-4" x="299" y="166" width="34" height="180" rx="17"/>
          <rect class="symphony-bar bar-5" x="359" y="208" width="34" height="96" rx="17"/>
        </g>
      </svg>
    </div>
    <div class="symphony-title">Symphony</div>
    <div class="symphony-wave-strip">
      <span class="wave-track t1"></span>
      <span class="wave-track t2"></span>
      <span class="wave-track t3"></span>
      <span class="wave-track t4"></span>
      <span class="wave-track t5"></span>
    </div>
  </div>

  <script>
    function dismissSymphonyLoader() {
      var loader = document.getElementById('symphony-loader');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        loader.style.transform = 'scale(0.96)';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissSymphonyLoader);
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var added = mutations[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          var tag = added[j].tagName;
          if (tag === 'FLUTTER-VIEW' || tag === 'FLT-GLASS-PANE' || tag === 'CANVAS') {
            setTimeout(dismissSymphonyLoader, 150);
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true });
  </script>

  <script src="flutter_bootstrap.js?v=4" async></script>
</body>
</html>
