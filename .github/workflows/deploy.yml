name: Build, Release & 24/7 Cloud Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    name: Test, Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Bundle APK into Web Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/web/symphony.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: symphony-release-bundle
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/

      - name: Publish Latest GitHub Release & APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Symphony Latest Release (Auto-Build)"
          body: |
            ## 🎵 Symphony Latest Build
            - **Commit**: `${{ github.sha }}`
            - **Android APK**: [Download symphony.apk](https://github.com/${{ github.repository }}/releases/download/latest/symphony.apk)
            - **Web Deployment**: Auto-deployed to 24/7 Cloud Host (`https://symphony.jettimothycerezo.dev`)
          draft: false
          prerelease: false
          files: |
            build/web/symphony.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-ghcr:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    name: Trigger 24/7 Cloud Host Deployment
    runs-on: ubuntu-latest
    needs: [test-and-build, docker-ghcr]
    steps:
      - name: Trigger Render Deploy Hook (if RENDER_DEPLOY_HOOK secret is set)
        if: "${{ env.RENDER_DEPLOY_HOOK != '' }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render 24/7 Webhook deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered successfully."

      - name: Deploy to Koyeb (if KOYEB_API_TOKEN secret is set)
        if: "${{ env.KOYEB_API_TOKEN != '' }}"
        uses: koyeb/action-git-deploy@v1
        with:
          token: ${{ secrets.KOYEB_API_TOKEN }}
          app-name: symphony
          service-name: symphony-web
