name: Build, Release & 24/7 Cloud Deploy

on:
  push:
    # Feature branches build and test too (including Windows) so changes are
    # checked before they reach main; only main and v* tags release/deploy.
    branches: [ main, 'desktop/**', 'mobile/**', 'shared/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Every CI build gets a unique, increasing version; the apps compare it with
  # the release title to offer updates.
  SYMPHONY_VERSION: 1.0.${{ github.run_number }}
  # Public fingerprint of the Android release key (android/key.properties).
  SYMPHONY_APK_CERT_SHA256: 16aaf1c1d0fc9269f522aa74d6874599eb85828ab0d4c125b26861306e5f9670

jobs:
  test-and-build-web-and-android:
    name: Test, Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=SYMPHONY_VERSION=${{ env.SYMPHONY_VERSION }}

      # Every release is signed with the same key so phones can update in
      # place. Branch builds without the secrets fall back to debug signing;
      # main refuses to ship an APK signed with anything else.
      - name: Set Up Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to release a debug-signed APK."
              exit 1
            fi
            echo "::warning::No signing secrets: this branch APK is debug-signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/symphony-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/symphony-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=symphony"
          } > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release --build-name=${{ env.SYMPHONY_VERSION }} --build-number=${{ github.run_number }} --dart-define=SYMPHONY_VERSION=${{ env.SYMPHONY_VERSION }}

      - name: Prepare Android Binary
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/symphony.apk
          if [ -f android/key.properties ]; then
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --print-certs build/symphony.apk | tee /tmp/certs.txt
            grep -qi "SHA-256 digest: $SYMPHONY_APK_CERT_SHA256" /tmp/certs.txt || { echo "::error::APK is not signed with the Symphony release key."; exit 1; }
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-web-bundle
          path: build/web/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-android-apk
          path: build/symphony.apk

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean Build Cache
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        id: build_windows
        continue-on-error: true
        run: flutter build windows --release -v --build-name=${{ env.SYMPHONY_VERSION }} --build-number=${{ github.run_number }} --dart-define=SYMPHONY_VERSION=${{ env.SYMPHONY_VERSION }}

      # Audio is extracted on the user's PC by yt-dlp (no Symphony server).
      # Ship the official *folder* build in Release\yt-dlp\: it starts ~0.5 s
      # faster per song than the single-file yt-dlp.exe, which unpacks itself
      # to %TEMP% on every launch. The app runs `-U` on it daily. Never in git.
      - name: Bundle yt-dlp (folder build)
        if: steps.build_windows.outcome == 'success'
        run: |
          $zip = 'build\yt-dlp_win.zip'
          $dest = 'build\windows\x64\runner\Release\yt-dlp'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_win.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          & "$dest\yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'bundled yt-dlp does not run' }

      - name: Compress Windows Distribution
        if: steps.build_windows.outcome == 'success'
        run: |
          New-Item -ItemType Directory -Force -Path build/dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\symphony-windows-x64.zip

      - name: Upload Windows Artifact
        if: steps.build_windows.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: symphony-windows-x64
          path: build\dist\symphony-windows-x64.zip

  # No paid Apple account: the Mac app is ad-hoc signed (a one-time
  # right-click > Open), and the iOS .ipa is unsigned, for people to sideload
  # with their own Apple ID (Sideloadly, AltStore).
  build-apple:
    name: Build macOS App & iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --build-name=${{ env.SYMPHONY_VERSION }} --build-number=${{ github.run_number }} --dart-define=SYMPHONY_VERSION=${{ env.SYMPHONY_VERSION }}

      - name: Package macOS App
        run: |
          mkdir -p build/dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Symphony.app build/dist/symphony-macos.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-macos
          path: build/dist/symphony-macos.zip

      - name: Build iOS Release (unsigned)
        run: flutter build ios --release --no-codesign --build-name=${{ env.SYMPHONY_VERSION }} --build-number=${{ github.run_number }} --dart-define=SYMPHONY_VERSION=${{ env.SYMPHONY_VERSION }}

      - name: Package iOS IPA
        run: |
          mkdir -p build/dist build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../dist/symphony-ios.ipa Payload)

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-ios
          path: build/dist/symphony-ios.ipa

  publish-release:
    name: Publish Multi-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [test-and-build-web-and-android, build-windows, build-apple]
    if: always() && needs.test-and-build-web-and-android.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, to list the changes since the last release.
          fetch-depth: 0

      - name: Create Release Directory
        run: mkdir -p release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: symphony-android-apk
          path: release-assets/

      - name: Download Windows ZIP
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: symphony-windows-x64
          path: release-assets/

      - name: Download macOS ZIP
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: symphony-macos
          path: release-assets/

      - name: Download iOS IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: symphony-ios
          path: release-assets/

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Symphony ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Symphony v${{ env.SYMPHONY_VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Write Release Notes
        # The app shows these in its update dialog, so list user-facing
        # commits (feat/fix/perf) since the previous release in plain words.
        run: |
          PREV=$(git rev-list -n 1 "${{ steps.release_meta.outputs.tag }}" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}HEAD"
          git log --no-merges --format=%s "$RANGE" \
            | grep -E '^(feat|fix|perf)(\([^)]*\))?!?: ' \
            | sed -E 's/^feat[^:]*: (.)/New: \u\1/; s/^fix[^:]*: (.)/Fixed: \u\1/; s/^perf[^:]*: (.)/Faster: \u\1/; s/^/- /' \
            | head -n 15 > release-notes.md || true
          if [ ! -s release-notes.md ]; then echo "- Bug fixes and improvements." > release-notes.md; fi
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-landing:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-and-build-web-and-android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: symphony-web-bundle
          path: site/

      - name: Add Custom Domain
        run: echo "symphony.jettimothycerezo.dev" > site/CNAME

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-ghcr:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build-web-and-android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Container
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  discord-bot:
    name: Test & Publish Discord Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord_bot
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord_bot/package-lock.json

      - name: Install & Test
        run: |
          npm ci
          npm test

      # Cloud machines are where YouTube most often asks to sign in. This shows
      # whether a server like the bot's host can still fetch audio. It only
      # reports; it never fails the build.
      - name: Check YouTube Audio From a Cloud Machine
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x /tmp/yt-dlp
          /tmp/yt-dlp --version
          if /tmp/yt-dlp -f bestaudio --no-playlist -o - --js-runtimes "node:$(which node)" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>/tmp/err | head -c 2000000 | wc -c | tee /tmp/bytes; then :; fi
          if [ "$(cat /tmp/bytes)" -gt 100000 ]; then
            echo "::notice title=Discord bot::YouTube audio downloads fine from a cloud machine."
          else
            echo "::warning title=Discord bot::YouTube blocked a cloud machine: $(grep ERROR /tmp/err | head -1). The bot will need a cookies file on a cloud host."
          fi

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built on every branch so a broken image shows up before main;
      # published from main and tags only. ARM too, for Oracle's free servers.
      - name: Build (and Publish) Bot Image
        uses: docker/build-push-action@v5
        with:
          context: discord_bot
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.name }}-discord-bot:latest
            ghcr.io/${{ steps.repo_name.outputs.name }}-discord-bot:${{ github.sha }}

  trigger-deploy:
    name: Trigger 24/7 Cloud Host Deployment
    runs-on: ubuntu-latest
    needs: [test-and-build-web-and-android, docker-ghcr]
    if: always() && needs.test-and-build-web-and-android.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Trigger Render Deploy Hook (if RENDER_DEPLOY_HOOK secret is set)
        if: "${{ env.RENDER_DEPLOY_HOOK != '' }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render 24/7 Webhook deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered successfully."

      - name: Deploy to Koyeb (if KOYEB_API_TOKEN secret is set)
        if: "${{ env.KOYEB_API_TOKEN != '' }}"
        uses: koyeb/action-git-deploy@v1
        with:
          token: ${{ secrets.KOYEB_API_TOKEN }}
          app-name: symphony
          service-name: symphony-web
