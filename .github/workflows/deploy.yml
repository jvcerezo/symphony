name: Build, Release & 24/7 Cloud Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test-and-build-web-and-android:
    name: Test, Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android Binary
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/web/symphony.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/symphony.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-web-bundle
          path: build/web/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-android-apk
          path: build/symphony.apk

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean Build Cache
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release -v

      - name: Compress Windows Distribution
        run: |
          New-Item -ItemType Directory -Force -Path build/dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\symphony-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-windows-x64
          path: build\dist\symphony-windows-x64.zip

  publish-release:
    name: Publish Multi-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [test-and-build-web-and-android, build-windows]
    if: always() && needs.test-and-build-web-and-android.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: symphony-android-apk
          path: release-assets/

      - name: Download Windows ZIP
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: symphony-windows-x64
          path: release-assets/

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Symphony ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Symphony Latest Release (Auto-Build)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            ## 🎵 Symphony Release Distribution
            - **Commit**: `${{ github.sha }}`
            - **Windows Desktop (x64)**: [Download symphony-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag }}/symphony-windows-x64.zip)
            - **Android APK**: [Download symphony.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag }}/symphony.apk)
            - **Web Deployment**: Auto-deployed to 24/7 Cloud Host (`https://symphony.jettimothycerezo.dev`)
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-ghcr:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build-web-and-android
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    name: Trigger 24/7 Cloud Host Deployment
    runs-on: ubuntu-latest
    needs: [test-and-build-web-and-android, docker-ghcr]
    if: always() && needs.test-and-build-web-and-android.result == 'success'
    steps:
      - name: Trigger Render Deploy Hook (if RENDER_DEPLOY_HOOK secret is set)
        if: "${{ env.RENDER_DEPLOY_HOOK != '' }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render 24/7 Webhook deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered successfully."

      - name: Deploy to Koyeb (if KOYEB_API_TOKEN secret is set)
        if: "${{ env.KOYEB_API_TOKEN != '' }}"
        uses: koyeb/action-git-deploy@v1
        with:
          token: ${{ secrets.KOYEB_API_TOKEN }}
          app-name: symphony
          service-name: symphony-web
